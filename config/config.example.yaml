# Home Dashboard — configuration template.
#
# Copy to config/config.yaml and edit (`make setup` does this for you), then
# check your work with `make check`.
#
# Every option the dashboard accepts appears below, commented out at its
# default where it is optional — scripts/check_docs.py fails the build if a
# config field exists in src/config.py but is missing from this file, so this
# list stays exhaustive. docs/configuration.md is the prose reference with the
# longer explanations.

display:
  # Display backend/provider.
  # "waveshare" = Waveshare e-Paper HATs using the waveshare_epd Python package.
  # "inky"      = Pimoroni Inky Impression panels using the inky Python package.
  provider: "waveshare"
  # Display model — sets native resolution automatically.
  # Waveshare models: epd7in5 (640x384), epd7in5_V2 (800x480), epd7in5b_V2 (800x480),
  #   epd7in5_HD (880x528), epd13in3k (960x680),
  #   epd10in85g (1360x480 — black/white/yellow/red; see the wide_* themes)
  # Inky models: impression_7_3_2025 (800x480)
  model: "epd7in5_V2"
  # width/height are derived automatically from `model`. Override here only if needed.
  # width: 800
  # height: 480
  # Partial refresh drives the panel with Waveshare's fast waveform
  # (`epd.init_fast()`), which is quicker but does not drive black as deeply —
  # large filled areas come out closer to charcoal than to ink, and ghosting
  # accumulates. The dashboard renders on a timer, so the seconds saved rarely
  # matter; leave this off unless you specifically want the faster update.
  # Waveshare only: Inky Impression panels always do a full refresh, so this
  # has no effect when provider is "inky". Themes whose plate is dithered
  # artwork opt out of it regardless and always take the full waveform.
  enable_partial_refresh: false
  # When partial refresh is on, force a full-waveform refresh after this many
  # partials. Lower it if blacks start looking washed out between full ones.
  max_partials_before_full: 20
  week_days: 7
  show_weather: true
  show_birthdays: true
  show_info_panel: true
  # Final quantization algorithm used when converting greyscale → 1-bit for the
  # Waveshare panel.  Ignored on Inky, which maps to its own palette instead.
  # "threshold"       – simple 128-level split; crisp black and white (default,
  #                     and what every built-in theme is designed against)
  # "floyd_steinberg" – error-diffusion dithering; better apparent grey in
  #                     photographic or shaded content, at the cost of speckle
  #                     on fine type
  # "ordered"         – 4×4 Bayer ordered dithering; structured dot-matrix pattern
  # A theme that declares its own preferred mode overrides this setting.
  # quantization_mode: "threshold"
  # How a theme canvas that is not the panel's size reaches the panel:
  # "stretch" pulls it to the panel's size (what every version so far did),
  # "fit" keeps its shape and pads the rest with the theme's background, and
  # "auto" stretches unless the stretch would bend the aspect ratio by more
  # than a third — so a 4:3 panel still stretches and a 1360x480 strip fits.
  # scaling: "auto"
  # Minimum seconds between hardware refreshes.  Unset means the provider
  # default: 60 on Inky, 0 on Waveshare.  A render whose content is unchanged
  # is skipped regardless of this setting; the cooldown only rate-limits
  # refreshes whose content *did* change.  Set 3600 on Inky to restore the v4
  # "repaint at most once an hour" behaviour.
  # min_refresh_interval_seconds: 60

google:
  service_account_path: "credentials/service_account.json"
  calendar_id: "your-calendar-id@group.calendar.google.com"
  additional_calendars: []
  # Required when birthdays.source is "contacts".
  # The service account must have domain-wide delegation enabled in Google
  # Workspace Admin with the People API scope granted, and this field must
  # be set to the email of the user whose contacts should be read.
  # contacts_email: "you@yourdomain.com"
  # Log a warning once the day's Google API call count passes this number.
  # daily_quota_warning: 500

  # --- ICS feed (simpler alternative — no GCP project or credentials required) ---
  # When ical_url is set, calendar events are fetched from this URL instead of
  # the Google Calendar API.  service_account_path is ignored for event fetching.
  #
  # How to get the URL:
  #   Google Calendar → Settings → [pick a calendar] → "Secret address in iCal format"
  #   Keep this URL private — anyone with it can read your calendar.
  #
  # ical_url: "https://calendar.google.com/calendar/ical/.../.../basic.ics"
  # additional_ical_urls: []   # optional extra calendars, merged with ical_url.
  #                            # If any one feed fails the whole fetch fails and
  #                            # the last complete calendar is rendered from cache
  #                            # with a staleness indicator — a partial calendar
  #                            # is never shown as if it were complete.

  # --- CalDAV alternative (Nextcloud / Radicale / Apple iCloud / Fastmail / ...) ---
  # When caldav_url is set, events are fetched from a CalDAV server. Both
  # ical_url and the Google API path are ignored for event fetching.
  # caldav_password_file points at a one-line file with the account password —
  # never inline the password in this YAML.
  #
  # caldav_url: "https://nextcloud.example.com/remote.php/dav/calendars/<user>/"
  # caldav_username: "your-username"
  # caldav_password_file: "credentials/caldav_password.txt"
  # caldav_calendar_url: ""   # optional specific calendar; default = first in principal

weather:
  api_key: "YOUR_OPENWEATHERMAP_API_KEY"
  # CHANGE THESE to your location (these are New York City defaults)
  latitude: 40.7128
  longitude: -74.0060
  units: "imperial"  # "imperial" or "metric"
  # Which One Call product supplies weather alerts and the UV index.
  # Keep the quotes — unquoted 3.0 is a YAML float, not this string.
  #   "3.0" — One Call 3.0 (default)
  #   "4.0" — One Call 4.0
  #   "off" — skip the request entirely if you hold no One Call subscription
  # 3.0 and 4.0 are separate products and an account can subscribe to only
  # one; picking the wrong one 401s exactly like having no subscription.
  # See docs/configuration.md § Weather API tiers.
  one_call_version: "3.0"

# PurpleAir air quality (optional) — leave commented out unless you have a
# sensor.  Both keys must be set for the source to be fetched at all; setting
# them to placeholder values means every run tries a real API call, fails, and
# trips the circuit breaker.
# purpleair:  # uncomment this line to enable section
#   # Get a free API key at develop.purpleair.com
#   api_key: "YOUR_PURPLEAIR_API_KEY"
#   # Find your sensor index at map.purpleair.com — click your sensor and note
#   # the number in the URL (e.g. ?select=12345 → sensor_id: 12345)
#   sensor_id: 12345

birthdays:
  source: "file"  # "file", "calendar", or "contacts"
  file_path: "config/birthdays.json"   # used when source is "file"
  calendar_keyword: "Birthday"          # used when source is "calendar"
  lookahead_days: 30

schedule:
  # Hour (0-23) when the display goes quiet — no refreshes until quiet_hours_end.
  quiet_hours_start: 23
  # Hour (0-23) when the display wakes up. The first run triggers a full refresh.
  quiet_hours_end: 6

# IANA timezone name for the display location.
# Use "local" to follow the system clock, or set explicitly (e.g. "America/Los_Angeles").
timezone: "local"

output:
  dry_run_dir: "output"

# Where runtime state lives: the data cache, circuit-breaker state, calendar
# sync tokens, random-theme picks, and the refresh throttle.  Safe to delete —
# everything in it is rebuilt on the next run.
# state_dir: "state"

logging:
  level: "INFO"

# Cache TTL — controls how long cached data is considered usable after a fetch failure.
# Data older than 4x the TTL is discarded entirely (EXPIRED).
# cache:  # uncomment this line to enable section
#   weather_ttl_minutes: 60       # 1 hour
#   events_ttl_minutes: 120       # 2 hours
#   birthdays_ttl_minutes: 1440   # 24 hours
#   # Fetch intervals — skip API calls when cached data is younger than this
#   weather_fetch_interval: 30    # 30 minutes
#   events_fetch_interval: 120    # 2 hours
#   birthdays_fetch_interval: 1440  # 24 hours
#   air_quality_ttl_minutes: 30        # 30 minutes
#   air_quality_fetch_interval: 15     # 15 minutes
#   # Circuit breaker — stop calling a failing API for a while instead of
#   # retrying it on every run.  Applied per source, so a dead weather API
#   # never holds up the calendar.
#   max_failures: 3               # consecutive failures before the breaker opens
#   cooldown_minutes: 30          # wait this long before trying the source again
#   # How often the displayed quote rotates. Uses a date-based hash so the same
#   # slot always shows the same quote (stable within the bucket, varies between).
#   # With 144 bundled quotes: daily ≈ 144-day cycle, twice_daily ≈ 72-day cycle,
#   # hourly ≈ 6-day cycle. Hash-based (not sequential), so repeats can occur.
#   quote_refresh: daily               # daily (default) | twice_daily | hourly

# Daily-quote store. Leave unset for the bundled config/quotes.json.
# `make deploy` rsyncs the repository over the Pi install and only spares
# config/config.yaml, so a customised config/quotes.json is overwritten on the
# next deploy — point this outside the tree to keep your own.
# quotes:  # uncomment this line to enable section
#   path: "/home/pi/dashboard-quotes.json"

# Event filtering — hide events from the display without removing them from cache.
# filters:  # uncomment this line to enable section
#   exclude_calendars: ["Holidays", "Spam Calendar"]
#   exclude_keywords: ["OOO", "Block", "Focus Time"]
#   exclude_all_day: false

# Dashboard title displayed in the header bar.
# title: "Home Dashboard"

# Photo theme — set theme: photo and provide a path to a JPEG or PNG file.
# The image is converted to grayscale, resized to fit the canvas, and dithered
# to 1-bit using Floyd-Steinberg diffusion.  A header bar at the bottom of the
# display shows the dashboard title and timestamp.
# photo:  # uncomment this line to enable section
#   path: /home/pi/wallpaper.jpg

# UI theme — controls overall layout, proportions, and visual style.
# Previews of every theme: docs/themes.md (monochrome) and
# docs/inky-previews.md (Inky Spectra 6 colour).
#
# --- theme names (kept in sync with the registry by scripts/check_docs.py) ---
#   WEEK VIEW       default | agenda | terminal | minimalist | old_fashioned |
#                   today | fantasy
#   FULL SCREEN     qotd | qotd_invert | fuzzyclock | fuzzyclock_invert |
#                   weather | moonphase | moonphase_invert | moonphase_photo
#   SPECIALIZED     timeline | year_pulse | monthly | sunrise | light_cycle |
#                   air_quality | astronomy | constellation_map | almanac |
#                   scorecard | tides | halftone | halftone_agenda | day_arc |
#                   trends | weatherglass
#   DITHERED ART    postcard | naturalist
#   PANORAMIC       wide_week | wide_day | wide_forecast | halftone_agenda_wide
#   PHOTO OVERLAY   photo
#   UTILITY         countdown | message | diags
#   ROTATION        random_daily | random_hourly
# --- end theme names ---------------------------------------------------------
#
# "random_daily"  — rotate once per day (first refresh after midnight).
# "random_hourly" — rotate once per hour (first refresh after the hour turns).
# "random" is an alias for "random_daily".
# Both random modes respect the include/exclude lists in random_theme below.
# The countdown, diags, message and photo themes never appear in a rotation —
# set them with `theme:` directly.
# theme: default

# Random theme rotation — only relevant when theme is "random_daily" or "random_hourly".
# Daily state persists in <state_dir>/random_theme_state.json.
# Hourly state persists in <state_dir>/random_theme_hourly_state.json.
# Delete the file to force a fresh pick before the bucket turns over.
# random_theme:  # uncomment this line to enable section
#   include: []  # Allowlist: only rotate among these themes (empty = all themes)
#   exclude: []  # Denylist: never use these themes
#                # Example: exclude: ["fantasy", "qotd"]

# Countdown theme — user-defined days-until tracker (set theme: countdown).
# Shows up to 5 upcoming events; one event renders as a hero with a giant numeral,
# multiple events stack as rows.  Past events are dropped automatically.
# countdown:  # uncomment this line to enable section
#   events:
#     - name: "Paris Trip"
#       date: "2026-06-04"
#     - name: "Anniversary"
#       date: "2026-08-12"
#     - name: "Product Launch"
#       date: "2026-05-15"

# Context-aware auto-theming — first matching rule wins.  Rules fire before
# `theme_schedule` and `theme`, but after `--theme` CLI override.  Conditions:
#   weather: OWM current description substring (scalar or list) — "rain", "snow",
#            "clear", "clouds", "thunderstorm", "fog", ...
#   weather_alert_present: true/false — match when any weather alert is active
#   daypart: "dawn", "day", "dusk", "night" (scalar or list).
#            With weather data:  dawn = sunrise ±90min, dusk = sunset−60min
#            through sunset, day = after dawn until dusk begins,
#            night = after sunset until the next dawn.  Without weather data,
#            fixed clock ranges anchored on a 06:30/18:30 sun cycle are used.
#   season:  "spring", "summer", "fall", "winter" (scalar or list)
#   weekday: "weekend", "weekday", or a day name (scalar or list)
#   calendar: state of today's events (scalar or list).  Values:
#            "empty"          — zero events scheduled today
#            "done"           — all of today's events have already ended
#            "active"         — currently inside an event
#            "upcoming_soon"  — next event starts within the next 30 minutes
#            "busy"           — 5+ events scheduled today
#            "birthday_today" — at least one birthday falls on today
#   temp_at_least / temp_at_most: inclusive temperature bounds, in the units set
#            by weather.units (°F for imperial, °C for metric).  Set both for a band.
#   aqi_at_least: inclusive EPA AQI floor.  Needs PurpleAir configured — without
#            it the source is never fetched and the rule never fires.
# Unset conditions do not constrain; all set conditions must match (AND).
# Rules requiring weather, air-quality or calendar data silently skip on first boot.
# theme_rules:  # uncomment this line to enable section
#   - when: { weather_alert_present: true }
#     theme: "message"
#   - when: { calendar: "birthday_today" }
#     theme: "today"
#   - when: { calendar: "upcoming_soon" }
#     theme: "today"
#   - when: { calendar: ["empty", "done"] }
#     theme: "qotd"
#   - when: { weather: ["rain", "snow", "thunderstorm"] }
#     theme: "weather"
#   - when: { daypart: "night", weather: "clear" }
#     theme: "moonphase"
#   - when: { aqi_at_least: 100 }
#     theme: "air_quality"
#   - when: { temp_at_most: 32 }
#     theme: "weatherglass"
#   - when: { temp_at_least: 95 }
#     theme: "weatherglass"
#   - when: { weekday: "weekend" }
#     theme: "today"

# Time-of-day theme schedule — automatically switches themes at configured times.
# Checked before random/explicit theme logic. Ignored when --theme is passed via CLI.
# Each entry maps a start time (HH:MM, 24-hour) to a concrete theme name.
# The active theme is the last entry whose time is <= the current local time.
# When no entry applies (all start after the current time), normal theme/random logic runs.
# theme_schedule:  # uncomment this line to enable section
#   - time: "06:00"
#     theme: "default"
#   - time: "20:00"
#     theme: "minimalist"
#   - time: "22:00"
#     theme: "fuzzyclock_invert"
