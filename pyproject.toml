[build-system]
# >=77 for PEP 639 (`license` as an SPDX expression + `license-files`).
# On 61 the string form is not understood and the bundled OFL texts would
# silently not ship in the wheel.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "home-dashboard"
dynamic = ["version"]
description = "Python eInk dashboard for Raspberry Pi — calendar, weather, birthdays, and daily quotes"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 form: an SPDX expression plus the license files to ship in the
# wheel. `license-files` carries the bundled fonts' OFL texts too, so an
# installed copy is self-documenting rather than pointing at a repo.
license = "MIT"
license-files = ["LICENSE", "fonts/*OFL*.txt"]
dependencies = [
    "Pillow>=10.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "requests>=2.28",
    "PyYAML>=6.0",
    "icalendar>=5.0",
    "recurring-ical-events>=3.0",
    "caldav>=1.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pinned, and pinned to the same version as .pre-commit-config.yaml
    # (tests/test_requirements_sync.py holds them together): ruff's formatter
    # output changes between minors, so a floor let the hook and CI disagree.
    "ruff==0.15.8",
    "mypy>=1.0",
    "flask>=3.0",
    "waitress>=3.0",
]
# Mirrors requirements-pi.txt, which is what `make pi-install` installs.
pi = [
    "RPi.GPIO>=0.7.1",
    "spidev>=3.8",
    "lgpio>=0.2.2.0",
    "gpiozero>=2.0.1.post3",
    "inky>=2.4.0",
]
web = [
    "flask>=3.0",
    "waitress>=3.0",
]

[tool.setuptools.dynamic]
# Single source of truth: src/_version.py. setuptools reads the literal via AST,
# so this never imports the package (no Pillow/numpy needed at build time).
version = {attr = "src._version.__version__"}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"
filterwarnings = [
    # Fail fast on Pillow API deprecations (e.g. getdata, removed in Pillow 14)
    # instead of letting hundreds of silent warnings accumulate.
    "error:.*deprecated and will be removed in Pillow.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/_version.py",
    "src/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
fail_under = 94

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "src.data.models"
disallow_untyped_defs = true
warn_return_any = true

