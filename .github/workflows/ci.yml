name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', os.environ['BASE_SHA'], os.environ['HEAD_SHA']]
          ).decode().strip('\0').split('\0')
          docs_only = bool(changed) and all(path.endswith('.md') for path in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"docs_only={str(docs_only).lower()}\n")
          print(f"Markdown-only change: {docs_only}")
          PY

  lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - if: needs.changes.outputs.docs_only == 'true'
        run: pip install PyYAML
      - if: needs.changes.outputs.docs_only != 'true'
        run: pip install -e ".[dev]"
      - if: needs.changes.outputs.docs_only != 'true'
        run: ruff check src/ tests/ scripts/ tools/ setup.py
      - if: needs.changes.outputs.docs_only != 'true'
        run: ruff format --check src/ tests/ scripts/ tools/ setup.py
      # Dead code in src/ (vulture); exclusions live in the script itself.
      - if: needs.changes.outputs.docs_only != 'true'
        run: python tools/check_dead_code.py
      # Required lint context also enforces Markdown links and inventories.
      - run: python scripts/check_docs.py

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Keep all four required `test (3.x)` contexts on Markdown-only PRs.
      # Skipping the matrix job itself reports only a single `test` context.
      - if: needs.changes.outputs.docs_only == 'true'
        run: echo "Markdown-only change; Python tests not needed."
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - if: needs.changes.outputs.docs_only != 'true'
        run: pip install -e ".[dev]"
      - if: needs.changes.outputs.docs_only != 'true'
        run: python -m pytest tests/ -v --tb=short

  test-core-install:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Asserts that `pip install .` alone (core deps only, no [dev]/[web] extras)
    # is sufficient to run the non-web test suite. Guards against runtime imports
    # of packages that are only declared under optional-dependencies.
    #
    # Web test files are skipped explicitly (they legitimately require
    # flask/waitress from the [web] extra). Test tooling (pytest) is the only
    # thing installed alongside core deps — no flask/waitress — so any
    # accidental import of an optional-extra package from core code will fail.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      # pytest-cov is required because pyproject.toml's addopts passes --cov;
      # it's test tooling, not an application dep, so it doesn't undermine the
      # "no optional-extra app packages" guarantee.
      - run: pip install . pytest pytest-cov
      # The pytest step below cannot detect a broken install. Three separate
      # mechanisms put the repo root on sys.path ahead of site-packages:
      # tests/__init__.py makes pytest prepend the rootdir, `python -m pytest`
      # prepends the cwd, and pyproject's `pythonpath = ["."]` adds it again.
      # So `import src.*` there always resolves to the checkout and the job
      # stays green no matter what `pip install .` produced — which is exactly
      # how it sat green while the install was scattering every module across
      # the top level of site-packages, unimportable.
      #
      # This step runs from a directory where the source tree is not
      # importable, so it exercises the installed package and nothing else.
      - name: Import the installed package from outside the source tree
        working-directory: /tmp
        run: |
          python - <<'PY'
          import src.app, src.main, src.config, src.data_pipeline
          import src.render.canvas, src.display.driver, src.fetchers.calendar
          from src._version import __version__
          from datetime import datetime
          from src.config import DisplayConfig
          from src.dummy_data import generate_dummy_data
          from src.render.canvas import render_dashboard
          from src._assets import asset_root
          from src.render.fonts import FONT_DIR
          from src.render.quotes import DEFAULT_QUOTES_PATH
          assert FONT_DIR.is_dir() and DEFAULT_QUOTES_PATH.is_file()
          assert (asset_root() / "assets/previews/theme_default.png").is_file()
          image = render_dashboard(
              generate_dummy_data(now=datetime(2026, 4, 6, 10, 30)), DisplayConfig()
          )
          image.save("/tmp/home-dashboard-installed.png")
          assert image.size == (800, 480)
          assert image.getextrema()[0] < image.getextrema()[1]
          print("installed home-dashboard", __version__)
          PY
      - run: python -m pytest tests/ --ignore-glob='tests/test_web_*.py' --tb=short --no-cov

  locked-install:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Installs the tested dependency snapshot (constraints/py<X.Y>.txt) through
    # the same Makefile targets `make pi-install` uses, on aarch64 so the pinned
    # wheels are the ones a 64-bit Pi gets. The GPIO packages from
    # requirements-pi.txt need Pi headers and hardware, so they stay out; the
    # Waveshare driver (and the 10.85" G demo driver) is installed at its pinned
    # commit and checked for every model module the dashboard names.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m venv venv
      - run: make _pip-locked REQS="-r requirements.txt -r requirements-web.txt"
      - name: Every installed package is the pinned version
        run: |
          venv/bin/python - <<'PY'
          import sys
          from importlib.metadata import distributions
          from pathlib import Path

          lock = Path(f"constraints/py{sys.version_info[0]}.{sys.version_info[1]}.txt")
          pins = dict(
              line.split("==", 1)
              for line in lock.read_text().splitlines()
              if line and not line.startswith("#")
          )
          wrong = []
          for dist in distributions():
              name = dist.metadata["Name"].lower().replace("_", "-").replace(".", "-")
              if name in {"pip", "setuptools"}:  # the venv's own bootstrap
                  continue
              if pins.get(name) != dist.version:
                  wrong.append(f"{name} {dist.version} (pinned: {pins.get(name)})")
          assert not wrong, wrong
          print(f"{lock}: every installed package matches")
          PY
      - run: venv/bin/pip install --no-deps -e . && venv/bin/pip install pytest pytest-cov
      - run: venv/bin/python -m pytest tests/ --tb=short --no-cov -q
      - run: venv/bin/python -m src.main --config config/config.example.yaml --dry-run --dummy
      - run: make install-waveshare-driver
      - name: Pinned driver carries every Waveshare model module
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/venv/bin/python" - <<'PY'
          import importlib
          import os
          import sys
          from pathlib import Path

          import waveshare_epd

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from src.display.driver import WAVESHARE_MODELS

          lib = Path(waveshare_epd.__file__).parent
          missing = [
              module
              for module, _w, _h in WAVESHARE_MODELS.values()
              if not (lib / f"{module.rsplit('.', 1)[1]}.py").is_file()
          ]
          assert not missing, missing

          # The G driver's config loads its DEV_Config .so at import, which an
          # arm64 host can do without the panel, so drive the real import and
          # pack one full frame.
          from PIL import Image

          g = importlib.import_module("waveshare_epd.epd10in85g")
          epd = g.EPD()
          buf = epd.getbuffer(Image.new("RGB", (1360, 480), (255, 255, 0)))
          assert len(buf) == 1360 // 4 * 480 and set(buf) == {0xAA}, len(buf)
          print("waveshare_epd has", sorted(WAVESHARE_MODELS))
          PY

  snapshot-tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Runs the pixel-hash snapshot assertions against the exact Pillow version
    # recorded in tests/snapshots/theme_pixel_hashes.json. The normal test
    # matrix compares hashes too, but xfails a mismatch when its Pillow differs
    # from the baseline's; here the versions match, so any mismatch fails.
    #
    # To intentionally update baselines: bump Pillow locally, run
    # UPDATE_SNAPSHOTS=1 pytest tests/test_theme_pixel_snapshots.py, and
    # commit both the new JSON (which records the new Pillow version) and
    # any source changes. This job will pick up the new version automatically.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Pin Pillow to the baseline's reference version
        run: |
          PV=$(python -c "import json; print(json.load(open('tests/snapshots/theme_pixel_hashes.json'))['reference_env']['pillow_version'])")
          echo "Installing Pillow==${PV}"
          pip install "Pillow==${PV}"
      - run: python -m pytest tests/test_theme_pixel_snapshots.py --tb=short --no-cov

  typecheck:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: python -m mypy src/

  smoke:
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Seed config from example
        run: cp config/config.example.yaml config/config.yaml
      - name: Validate example config
        run: python -m src.main --check-config
      - name: Render dummy dashboard
        run: python -m src.main --dry-run --dummy
