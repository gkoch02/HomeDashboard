version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    assignees:
      - gkoch02
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    assignees:
      - gkoch02
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
